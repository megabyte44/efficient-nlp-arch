# Stage-2 variant: same shape/training setup as configs/baseline_tiny.yaml,
# swapping full attention for windowed causal attention, so the benchmark
# comparison isolates the effect of attn_type.

run_name: local_tiny

data_path: data/tinyshakespeare.txt
val_fraction: 0.1

# model
attn_type: local
window_size: 32
n_layer: 4
n_head: 4
n_embd: 128
block_size: 128
dropout: 0.1
bias: false
# vocab_size is set at runtime from the tokenizer

# training
batch_size: 32
max_iters: 2000
eval_interval: 200
eval_iters: 50
learning_rate: 0.001
weight_decay: 0.01
grad_clip: 1.0
seed: 1337

out_dir: experiments/local_tiny
